<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent Payments - Lil Mosey Estate 6G Edition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">

</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">LM</div>
      <div class="sidebar-logo-text">
        <h3><span class="gold">Lil Mosey</span> Estate</h3>
        <small>Tenant Portal</small>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">T</div>
      <div class="sidebar-user-info">
        <h6 id="user-name">Tenant</h6>
        <small>Renter</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <span class="sidebar-nav-label">Overview</span>
      <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a class="nav-link active" href="payments.html"><i class="fas fa-credit-card"></i> Rent Payments</a>
      <span class="sidebar-nav-label">Manage</span>
      <a class="nav-link" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a>
      <a class="nav-link" href="documents.html"><i class="fas fa-file-alt"></i> Documents</a>
      <span class="sidebar-separator"></span>
      <a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Profile</a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
      <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </aside>
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn d-md-none" id="sidebar-toggle" style="font-size:1.2rem;color:#0B1F3A;"><i class="fas fa-bars"></i></button>
        <h4>Rent Payments</h4>
      </div>
      <div class="topbar-right">
        <div class="d-flex align-items-center gap-2">
          <div class="user-avatar" id="user-avatar">T</div>
          <span class="fw-semibold" style="font-size:0.9rem;color:#333;">Tenant</span>
        </div>
        <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </header>
    <div class="dash-content">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="content-card">
            <div class="card-header"><h5><i class="fas fa-plus-circle me-2"></i>Make Payment</h5></div>
            <div class="card-body">
              <form id="payment-form">
                <div class="mb-3">
                  <label class="form-label">Lease</label>
                  <select class="form-select" id="lease-id" required>
                    <option value="">Select lease...</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Amount (KES)</label>
                  <input type="number" class="form-control" id="payment-amount" placeholder="e.g. 65000" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Payment Month</label>
                  <input type="month" class="form-control" id="payment-month" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Payment Method</label>
                  <select class="form-select" id="payment-method" required>
                    <option value="">Select method...</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="bank_transfer">Bank Transfer</option>
                    <option value="paypal">PayPal</option>
                    <option value="stripe">Stripe</option>
                    <option value="cash">Cash</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100" id="pay-btn">Submit Payment</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="content-card">
            <div class="card-header"><h5><i class="fas fa-history me-2"></i>Payment History</h5></div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table">
                  <thead><tr><th>Receipt</th><th>Property</th><th>Month</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th><th>QR</th></tr></thead>
                  <tbody id="payments-tbody"><tr><td colspan="8" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script>
  function formatCurrency(v){return 'KES '+Number(v||0).toLocaleString()}
  function formatDate(d){if(!d)return '-';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}

  (function(){
    try{
      const user=JSON.parse(localStorage.getItem('user')||'{}');
      if(user.first_name){
        document.getElementById('user-name').textContent=user.first_name+' '+(user.last_name||'');
        document.getElementById('user-avatar').textContent=user.first_name.charAt(0).toUpperCase();
      }
    }catch(e){}

    async function loadLeases(){
      try{
        const res=await api.get('/tenants/leases');
        const leases=res.data.leases||[];
        const activeLeases=leases.filter(l=>l.status==='active');
        const sel=document.getElementById('lease-id');
        sel.innerHTML='<option value="">Select lease...</option>'+activeLeases.map(l=>`<option value="${l.lease_id}" data-rent="${l.rent_amount}">${l.property_title} - KES ${Number(l.rent_amount).toLocaleString()}/mo</option>`).join('');
        if(activeLeases.length) document.getElementById('payment-amount').value=activeLeases[0].rent_amount;
      }catch(err){console.error('Failed to load leases',err)}
    }

    document.getElementById('lease-id').addEventListener('change',function(){
      const opt=this.options[this.selectedIndex];
      if(opt&&opt.dataset.rent) document.getElementById('payment-amount').value=opt.dataset.rent;
    });

    async function loadPayments(){
      try{
        const res=await api.get('/tenants/payments');
        const payments=res.data.payments||[];
        const tbody=document.getElementById('payments-tbody');
        if(!payments.length){
          tbody.innerHTML='<tr><td colspan="8" class="text-center py-5 text-muted">No payments yet</td></tr>';
          return;
        }
        tbody.innerHTML=payments.map(p=>`
          <tr>
            <td><code>${p.receipt_number||'N/A'}</code></td>
            <td>${p.property_title||'-'}</td>
            <td>${p.payment_month||'-'}</td>
            <td><strong>${formatCurrency(p.amount)}</strong></td>
            <td><span class="text-capitalize">${p.payment_method}</span></td>
            <td><span class="badge-status ${p.status}">${p.status.charAt(0).toUpperCase()+p.status.slice(1)}</span></td>
            <td>${formatDate(p.paid_at||p.created_at)}</td>
            <td>${p.status==='pending'?`<button class="btn btn-sm" style="background:rgba(212,175,55,0.15);color:#D4AF37;border:1px solid rgba(212,175,55,0.3);border-radius:6px;font-size:0.75rem;" onclick="generateTenantQR(${p.rent_payment_id})" title="View Payment QR"><i class="fas fa-qrcode"></i></button>`:'-'}</td>
          </tr>
        `).join('');
      }catch(err){
        document.getElementById('payments-tbody').innerHTML='<tr><td colspan="8" class="text-center py-5 text-muted">Failed to load</td></tr>';
      }
    }

    document.getElementById('payment-form').addEventListener('submit',async function(e){
      e.preventDefault();
      const btn=document.getElementById('pay-btn');
      btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Processing...';
      try{
        const res=await api.post('/tenants/payments',{
          lease_id:document.getElementById('lease-id').value,
          amount:document.getElementById('payment-amount').value,
          payment_month:document.getElementById('payment-month').value,
          payment_method:document.getElementById('payment-method').value
        });
        const qrData = res.data && res.data.qr ? res.data.qr : null;
        if (qrData) {
          Swal.fire({
            title: 'Rent Payment Created!',
            html: `<div style="text-align:center;">
                     <p style="color:#666;font-size:0.9rem;margin-bottom:12px;">Scan this QR to complete your M-Pesa payment</p>
                     <img src="${qrData.qr_code}" style="width:220px;height:220px;border-radius:12px;margin:8px 0;">
                     <p style="color:#666;font-size:0.85rem;margin:8px 0;"><strong>Amount:</strong> KES ${Number(qrData.amount).toLocaleString()}</p>
                     <p style="color:#666;font-size:0.85rem;"><strong>Month:</strong> ${qrData.payment_month}</p>
                     <p style="color:#999;font-size:0.75rem;margin-top:8px;">Expires: ${new Date(qrData.expires_at).toLocaleTimeString()}</p>
                   </div>`,
            confirmButtonColor: '#D4AF37',
            confirmButtonText: 'Done',
            width: 400
          });
        } else {
          Swal.fire({icon:'success',title:'Payment Initiated!',text:'Your rent payment has been submitted.',confirmButtonColor:'#D4AF37',timer:1500,showConfirmButton:false});
        }
        document.getElementById('payment-form').reset();
        loadPayments();
        loadLeases();
      }catch(err){Swal.fire({icon:'error',title:'Failed',text:err.message})}
      finally{btn.disabled=false;btn.innerHTML='Submit Payment'}
    });

        document.getElementById('logout-btn').addEventListener('click',()=>auth.logout());

    async function generateTenantQR(paymentId) {
      try {
        const res = await api.post('/qr/tenant/' + paymentId);
        const qr = res.data;
        Swal.fire({
          title: 'Rent Payment QR',
          html: `<div style="text-align:center;">
                   <img src="${qr.qr_code}" style="width:220px;height:220px;border-radius:12px;margin:12px 0;">
                   <p style="color:#666;font-size:0.85rem;margin:8px 0;"><strong>Amount:</strong> KES ${Number(qr.amount).toLocaleString()}</p>
                   <p style="color:#666;font-size:0.85rem;"><strong>Month:</strong> ${qr.payment_month}</p>
                   <p style="color:#666;font-size:0.85rem;"><strong>Property:</strong> ${qr.property_title}</p>
                   <p style="color:#999;font-size:0.75rem;margin-top:8px;">Expires: ${new Date(qr.expires_at).toLocaleTimeString()}</p>
                   <p style="color:#999;font-size:0.72rem;margin-top:4px;">Scan this QR on your phone to pay via M-Pesa with Safe PIN</p>
                 </div>`,
          confirmButtonColor: '#D4AF37',
          confirmButtonText: 'Close',
          width: 400
        });
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Failed', text: err.message, confirmButtonColor: '#D4AF37' });
      }
    }
    window.generateTenantQR = generateTenantQR;
    loadLeases();
    loadPayments();
  })();
  </script>
</body>
</html>
