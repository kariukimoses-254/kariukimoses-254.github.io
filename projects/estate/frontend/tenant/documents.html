<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Documents - Lil Mosey Estate 6G Edition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">

</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">LM</div>
      <div class="sidebar-logo-text">
        <h3><span class="gold">Lil Mosey</span> Estate</h3>
        <small>Tenant Portal</small>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">T</div>
      <div class="sidebar-user-info">
        <h6 id="user-name">Tenant</h6>
        <small>Renter</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <span class="sidebar-nav-label">Overview</span>
      <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a class="nav-link" href="payments.html"><i class="fas fa-credit-card"></i> Rent Payments</a>
      <span class="sidebar-nav-label">Manage</span>
      <a class="nav-link" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a>
      <a class="nav-link active" href="documents.html"><i class="fas fa-file-alt"></i> Documents</a>
      <span class="sidebar-separator"></span>
      <a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Profile</a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
      <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </aside>
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn d-md-none" id="sidebar-toggle" style="font-size:1.2rem;color:#0B1F3A;"><i class="fas fa-bars"></i></button>
        <h4>Lease Documents</h4>
      </div>
      <div class="topbar-right">
        <div class="d-flex align-items-center gap-2">
          <div class="user-avatar" id="user-avatar">T</div>
          <span class="fw-semibold" style="font-size:0.9rem;color:#333;">Tenant</span>
        </div>
        <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </header>
    <div class="dash-content">
      <div id="documents-container" class="row g-4">
        <div class="col-12 text-center py-5 text-muted">Loading...</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script>
  function formatDate(d){if(!d)return '-';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}

  (function(){
    try{
      const user=JSON.parse(localStorage.getItem('user')||'{}');
      if(user.first_name){
        document.getElementById('user-name').textContent=user.first_name+' '+(user.last_name||'');
        document.getElementById('user-avatar').textContent=user.first_name.charAt(0).toUpperCase();
      }
    }catch(e){}

    async function loadDocuments(){
      try{
        const res=await api.get('/tenants/documents');
        const docs=res.data.documents||[];
        const container=document.getElementById('documents-container');
        if(!docs.length){
          container.innerHTML='<div class="col-12"><div class="empty-state"><i class="fas fa-file-alt"></i><h5>No Documents</h5><p class="text-muted">There are no lease documents available yet.</p></div></div>';
          return;
        }
        container.innerHTML=docs.map(d=>{
          const typeClass=d.document_type==='lease_agreement'?'pdf':'doc';
          const icon=typeClass==='pdf'?'fa-file-pdf':'fa-file-alt';
          return `<div class="col-md-6 col-lg-4">
            <div class="doc-card">
              <div class="doc-icon ${typeClass}"><i class="fas ${icon}"></i></div>
              <div class="doc-info">
                <h6>${d.document_name}</h6>
                <p>${d.property_title||'Property'} &middot; ${formatDate(d.created_at)}</p>
                <span class="badge-status ${d.is_signed?'signed':'unsigned'}">${d.is_signed?'Signed':'Pending'}</span>
              </div>
              <a href="../${d.document_path}" target="_blank" class="btn btn-sm btn-outline-custom" title="View"><i class="fas fa-eye"></i></a>
            </div>
          </div>`;
        }).join('');
      }catch(err){
        document.getElementById('documents-container').innerHTML='<div class="col-12 text-center py-5 text-muted">Failed to load documents</div>';
      }
    }

        document.getElementById('logout-btn').addEventListener('click',()=>auth.logout());
    loadDocuments();
  })();
  </script>
</body>
</html>
