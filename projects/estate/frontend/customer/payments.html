<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payments - Lil Mosey Estate 6G Edition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">

</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">LM</div>
      <div class="sidebar-logo-text">
        <h3><span class="gold">Lil Mosey</span> Estate</h3>
        <small>Customer Portal</small>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">C</div>
      <div class="sidebar-user-info">
        <h6 id="user-name">Customer</h6>
        <small>Tenant</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <span class="sidebar-nav-label">Overview</span>
      <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a>
      <a class="nav-link" href="favorites.html"><i class="fas fa-heart"></i> Favorites</a>
      <span class="sidebar-nav-label">Account</span>
      <a class="nav-link active" href="payments.html"><i class="fas fa-credit-card"></i> My Payments</a>
      <span class="sidebar-separator"></span>
      <span class="sidebar-nav-label">Support</span>
      <a class="nav-link" href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
      <a class="nav-link" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a>
      <a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Profile</a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
      <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </aside>
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
<button class="btn d-md-none" id="sidebar-toggle" title="Toggle navigation menu"><i class="fas fa-bars"></i></button>
        <h4>My Payments</h4>
      </div>
      <div class="topbar-right">
        <div class="d-flex align-items-center gap-2">
          <div class="user-avatar" id="user-avatar">C</div>
<span class="fw-semibold user-name-text">Customer</span>
        </div>
        <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </header>
    <div class="dash-content">
      <div class="content-card shadow-3d">
        <div class="card-header"><h5><i class="fas fa-credit-card me-2"></i>Payment History</h5></div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table">
              <thead><tr><th>Invoice</th><th>Property</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead>
              <tbody id="payments-tbody"><tr><td colspan="6" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script>
  function formatCurrency(v){return 'KES '+Number(v||0).toLocaleString()}
  function formatDate(d){if(!d)return '-';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}

  (function(){
    try{
      const user=JSON.parse(localStorage.getItem('user')||'{}');
      if(user.first_name){
        document.getElementById('user-name').textContent=user.first_name+' '+(user.last_name||'');
        document.getElementById('user-avatar').textContent=user.first_name.charAt(0).toUpperCase();
      }
    }catch(e){}

    async function loadPayments(){
      try{
        const res=await api.get('/payments/my-payments');
        const payments=res.data.payments||[];
        const tbody=document.getElementById('payments-tbody');
        if(!payments.length){
          tbody.innerHTML='<tr><td colspan="6" class="text-center py-5 text-muted">No payments found</td></tr>';
          return;
        }
        tbody.innerHTML=payments.map(p=>`
          <tr>
            <td><code>${p.invoice_number||'N/A'}</code></td>
            <td>${p.property_title||'N/A'}</td>
            <td><strong>${formatCurrency(p.amount)}</strong></td>
            <td><span class="text-capitalize">${p.payment_method}</span></td>
            <td><span class="badge-status ${p.status}">${p.status.charAt(0).toUpperCase()+p.status.slice(1)}</span></td>
            <td>${formatDate(p.paid_at||p.created_at)}</td>
          </tr>
        `).join('');
      }catch(err){
        document.getElementById('payments-tbody').innerHTML='<tr><td colspan="6" class="text-center py-5 text-muted">Failed to load payments</td></tr>';
      }
    }

        document.getElementById('logout-btn').addEventListener('click',()=>auth.logout());
    loadPayments();
  })();
  </script>
</body>
</html>
