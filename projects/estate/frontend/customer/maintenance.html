<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance - Lil Mosey Estate 6G Edition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">

</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">LM</div>
      <div class="sidebar-logo-text">
        <h3><span class="gold">Lil Mosey</span> Estate</h3>
        <small>Customer Portal</small>
      </div>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar">C</div>
      <div class="sidebar-user-info">
        <h6 id="user-name">Customer</h6>
        <small>Tenant</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <span class="sidebar-nav-label">Overview</span>
      <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> My Bookings</a>
      <a class="nav-link" href="favorites.html"><i class="fas fa-heart"></i> Favorites</a>
      <span class="sidebar-nav-label">Account</span>
      <a class="nav-link" href="payments.html"><i class="fas fa-credit-card"></i> My Payments</a>
      <span class="sidebar-separator"></span>
      <span class="sidebar-nav-label">Support</span>
      <a class="nav-link" href="messages.html"><i class="fas fa-envelope"></i> Messages</a>
      <a class="nav-link active" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance</a>
      <a class="nav-link" href="profile.html"><i class="fas fa-user"></i> Profile</a>
    </nav>
    <div class="sidebar-footer">
      <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
      <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </aside>
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
<button class="btn d-md-none" id="sidebar-toggle" title="Toggle navigation menu"><i class="fas fa-bars"></i></button>
        <h4>Maintenance Requests</h4>
      </div>
      <div class="topbar-right">
        <div class="d-flex align-items-center gap-2">
          <div class="user-avatar" id="user-avatar">C</div>
<span class="fw-semibold user-name-text">Customer</span>
        </div>
        <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </header>
    <div class="dash-content">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="content-card shadow-3d">
            <div class="card-header"><h5><i class="fas fa-plus-circle me-2"></i>New Request</h5></div>
            <div class="card-body">
              <form id="maintenance-form">
                <div class="mb-3">
                  <label class="form-label">Property</label>
                  <select class="form-select" id="property-id" required>
                    <option value="">Select a property...</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Title</label>
                  <input type="text" class="form-control form-control-modern" id="request-title" placeholder="e.g. Plumbing Issue" required>
                </div>
                <div class="mb-3">
                  <label class="form-label">Description</label>
                  <textarea class="form-control form-control-modern" id="request-desc" rows="3" placeholder="Describe the issue..." required></textarea>
                </div>
                <div class="mb-3">
                  <label class="form-label">Priority</label>
                  <select class="form-select" id="request-priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">Urgent</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary-custom btn-3d btn-3d-gold w-100" id="submit-request">Submit Request</button>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="content-card shadow-3d">
            <div class="card-header"><h5><i class="fas fa-list me-2"></i>My Requests</h5></div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table">
                  <thead><tr><th>Title</th><th>Property</th><th>Priority</th><th>Status</th><th>Date</th></tr></thead>
                  <tbody id="requests-tbody"><tr><td colspan="5" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script>
  function formatDate(d){if(!d)return '-';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}

  (function(){
    try{
      const user=JSON.parse(localStorage.getItem('user')||'{}');
      if(user.first_name){
        document.getElementById('user-name').textContent=user.first_name+' '+(user.last_name||'');
        document.getElementById('user-avatar').textContent=user.first_name.charAt(0).toUpperCase();
      }
    }catch(e){}

    async function loadProperties(){
      try{
        const res=await api.get('/properties?limit=100');
        const props=res.data.properties||[];
        const sel=document.getElementById('property-id');
        sel.innerHTML='<option value="">Select a property...</option>'+props.map(p=>`<option value="${p.property_id}">${p.title} - ${p.city||''}</option>`).join('');
      }catch(err){console.error('Failed to load properties',err)}
    }

    async function loadRequests(){
      try{
        const res=await api.get('/maintenance/my-requests');
        const requests=res.data.requests||[];
        const tbody=document.getElementById('requests-tbody');
        if(!requests.length){
          tbody.innerHTML='<tr><td colspan="5" class="text-center py-5 text-muted">No requests yet</td></tr>';
          return;
        }
        tbody.innerHTML=requests.map(r=>`
          <tr>
            <td><strong>${r.title}</strong></td>
            <td>${r.property_title||'-'}</td>
            <td><span class="badge-status priority-${r.priority}">${(r.priority||'medium').charAt(0).toUpperCase()+(r.priority||'medium').slice(1)}</span></td>
            <td><span class="badge-status ${r.status}">${r.status.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</span></td>
            <td>${formatDate(r.created_at)}</td>
          </tr>
        `).join('');
      }catch(err){
        document.getElementById('requests-tbody').innerHTML='<tr><td colspan="5" class="text-center py-5 text-muted">Failed to load</td></tr>';
      }
    }

    document.getElementById('maintenance-form').addEventListener('submit',async function(e){
      e.preventDefault();
      const btn=document.getElementById('submit-request');
      btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Submitting...';
      try{
        await api.post('/maintenance',{
          property_id:document.getElementById('property-id').value,
          title:document.getElementById('request-title').value,
          description:document.getElementById('request-desc').value,
          priority:document.getElementById('request-priority').value
        });
        Swal.fire({icon:'success',title:'Submitted!',text:'Maintenance request created.',confirmButtonColor:'#D4AF37',timer:1500,showConfirmButton:false});
        document.getElementById('maintenance-form').reset();
        loadRequests();
      }catch(err){Swal.fire({icon:'error',title:'Failed',text:err.message})}
      finally{btn.disabled=false;btn.innerHTML='Submit Request'}
    });

        document.getElementById('logout-btn').addEventListener('click',()=>auth.logout());
    loadProperties();
    loadRequests();
  })();
  </script>
</body>
</html>
