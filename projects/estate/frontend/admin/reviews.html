<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Management - Lil Mosey Estate 6G Edition Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">

</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">LM</div>
    <div class="sidebar-logo-text">
      <h3><span class="gold">Lil Mosey</span> Estate</h3>
      <small>Admin Panel</small>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-user-avatar">A</div>
    <div class="sidebar-user-info">
      <h6 id="user-name">Admin</h6>
      <small>Administrator</small>
    </div>
  </div>
  <nav class="sidebar-nav">
    <span class="sidebar-nav-label">Main</span>
    <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a class="nav-link" href="users.html"><i class="fas fa-users"></i> Users <span class="nav-badge" id="badge-users"></span></a>
    <a class="nav-link" href="properties.html"><i class="fas fa-building"></i> Properties</a>
    <a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings <span class="nav-badge" id="badge-bookings"></span></a>
    <span class="sidebar-nav-label">Finance</span>
    <a class="nav-link" href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    <a class="nav-link active" href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
    <span class="sidebar-separator"></span>
    <span class="sidebar-nav-label">Support</span>
    <a class="nav-link" href="messages.html"><i class="fas fa-envelope"></i> Messages <span class="nav-badge" id="badge-messages"></span></a>
    <a class="nav-link" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance <span class="nav-badge" id="badge-maintenance"></span></a>
    <a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
    <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
</aside>
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn d-md-none" id="sidebar-toggle" style="font-size:1.2rem;color:#0B1F3A;"><i class="fas fa-bars"></i></button>
        <h4>Review Management</h4>
      </div>
      <div class="topbar-right d-flex align-items-center gap-3">
        <span class="fw-semibold" style="font-size:0.9rem;color:#333;">Admin</span>
        <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </header>
    <div class="dash-content">
      <div class="content-card">
        <div class="card-header"><h5><i class="fas fa-star me-2"></i>All Reviews</h5></div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table">
              <thead><tr><th>User</th><th>Property</th><th>Rating</th><th>Comment</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
              <tbody id="reviews-tbody"><tr><td colspan="7" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script>
  function formatDate(d) { if(!d) return '-'; return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
  function renderStars(rating) { return Array(5).fill(0).map((_,i) => `<i class="fas fa-star" style="color:${i<rating?'#D4AF37':'#ddd'};font-size:0.8rem;"></i>`).join(''); }

  async function loadReviews() {
    try {
      const res = await api.get('/reviews');
      const reviews = res.data.reviews || [];
      const tbody = document.getElementById('reviews-tbody');
      if(reviews.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No reviews found</td></tr>';
        return;
      }
      tbody.innerHTML = reviews.map(r => `
        <tr>
          <td>${r.first_name || ''} ${r.last_name || ''}</td>
          <td>${r.property_title || 'N/A'}</td>
          <td class="review-rating">${renderStars(r.rating)} <small>(${r.rating})</small></td>
          <td>${(r.comment||'').substring(0,80)}${(r.comment||'').length>80?'...':''}</td>
          <td><span class="badge-status ${r.is_approved ? 'approved' : 'pending'}">${r.is_approved ? 'Approved' : 'Pending'}</span></td>
          <td>${formatDate(r.created_at)}</td>
          <td>
            ${!r.is_approved ? `<div class="btn-group btn-group-sm">
              <button class="btn btn-sm" style="background:#27ae60;color:#fff;" onclick="approveReview(${r.review_id})"><i class="fas fa-check"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="rejectReview(${r.review_id})"><i class="fas fa-times"></i></button>
            </div>` : '<span class="text-muted">Approved</span>'}
          </td>
        </tr>
      `).join('');
    } catch(err) {
      document.getElementById('reviews-tbody').innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Failed to load reviews</td></tr>';
    }
  }

  async function approveReview(id) {
    try {
      await api.put('/reviews/' + id + '/approve');
      Swal.fire({icon:'success', title:'Approved!', text:'Review approved.', confirmButtonColor:'#D4AF37'});
      loadReviews();
    } catch(err) { Swal.fire({icon:'error', title:'Failed', text:err.message}); }
  }

  async function rejectReview(id) {
    const result = await Swal.fire({icon:'warning', title:'Reject Review?', text:'This will delete the review.', showCancelButton:true, confirmButtonColor:'#e74c3c', confirmButtonText:'Reject'});
    if(result.isConfirmed) {
      try {
        await api.put('/reviews/' + id + '/reject');
        Swal.fire({icon:'success', title:'Rejected', text:'Review removed.', confirmButtonColor:'#D4AF37'});
        loadReviews();
      } catch(err) { Swal.fire({icon:'error', title:'Failed', text:err.message}); }
    }
  }

    document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
  loadReviews();
  </script>
</body>
</html>
