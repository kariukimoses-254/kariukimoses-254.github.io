<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Lil Mosey Estate 6G Edition Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">

</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">LM</div>
    <div class="sidebar-logo-text">
      <h3><span class="gold">Lil Mosey</span> Estate</h3>
      <small>Admin Panel</small>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-user-avatar">A</div>
    <div class="sidebar-user-info">
      <h6 id="user-name">Admin</h6>
      <small>Administrator</small>
    </div>
  </div>
  <nav class="sidebar-nav">
    <span class="sidebar-nav-label">Main</span>
    <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a class="nav-link" href="users.html"><i class="fas fa-users"></i> Users <span class="nav-badge" id="badge-users"></span></a>
    <a class="nav-link" href="properties.html"><i class="fas fa-building"></i> Properties</a>
    <a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings <span class="nav-badge" id="badge-bookings"></span></a>
    <span class="sidebar-nav-label">Finance</span>
    <a class="nav-link" href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    <a class="nav-link" href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
    <span class="sidebar-separator"></span>
    <span class="sidebar-nav-label">Support</span>
    <a class="nav-link" href="messages.html"><i class="fas fa-envelope"></i> Messages <span class="nav-badge" id="badge-messages"></span></a>
    <a class="nav-link" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance <span class="nav-badge" id="badge-maintenance"></span></a>
    <a class="nav-link active" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
    <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
</aside>
<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn d-md-none" id="sidebar-toggle" style="font-size:1.2rem;color:#0B1F3A;"><i class="fas fa-bars"></i></button>
      <h4>System Settings</h4>
    </div>
    <div class="topbar-right d-flex align-items-center gap-3">
      <span class="fw-semibold" style="font-size:0.9rem;color:#333;">Admin</span>
      <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>
  <div class="dash-content">
    <form id="settings-form">
      <div class="content-card">
        <div class="card-header"><h5><i class="fas fa-globe me-2"></i>General Settings</h5></div>
        <div class="card-body">
          <div class="section-title">Site Information</div>
          <div class="row g-3 mb-4">
            <div class="col-md-6"><label class="form-label">Site Name</label><input type="text" class="form-control" id="site_name"></div>
            <div class="col-md-6"><label class="form-label">Site Tagline</label><input type="text" class="form-control" id="site_tagline"></div>
            <div class="col-md-4"><label class="form-label">Contact Email</label><input type="email" class="form-control" id="site_email"></div>
            <div class="col-md-4"><label class="form-label">Contact Phone</label><input type="text" class="form-control" id="site_phone"></div>
            <div class="col-md-4"><label class="form-label">Site Address</label><input type="text" class="form-control" id="site_address"></div>
            <div class="col-md-3"><label class="form-label">Currency</label><input type="text" class="form-control" id="currency" value="KES"></div>
            <div class="col-md-3"><label class="form-label">Tax Rate (%)</label><input type="number" class="form-control" id="tax_rate"></div>
            <div class="col-md-3"><label class="form-label">Commission Rate (%)</label><input type="number" step="0.1" class="form-control" id="commission_rate"></div>
            <div class="col-md-3"><label class="form-label">Items Per Page</label><input type="number" class="form-control" id="items_per_page"></div>
          </div>
          <hr>
          <div class="section-title mt-4">Email Configuration</div>
          <div class="row g-3 mb-4">
            <div class="col-md-6"><label class="form-label">SMTP Host</label><input type="text" class="form-control" id="smtp_host"></div>
            <div class="col-md-3"><label class="form-label">SMTP Port</label><input type="number" class="form-control" id="smtp_port"></div>
            <div class="col-md-3"><label class="form-label">From Name</label><input type="text" class="form-control" id="from_name"></div>
            <div class="col-md-6"><label class="form-label">SMTP Username</label><input type="text" class="form-control" id="smtp_user"></div>
            <div class="col-md-6"><label class="form-label">SMTP Password</label><input type="password" class="form-control" id="smtp_pass"></div>
          </div>
        </div>
      </div>
      <div class="text-end"><button type="submit" class="btn btn-primary-custom btn-lg"><i class="fas fa-save me-2"></i>Save Settings</button></div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/main.js"></script>
<script>
async function loadSettings() {
  try {
    const res = await api.get('/admin/settings');
    const settings = res.data.settings || [];
    settings.forEach(s => {
      const el = document.getElementById(s.setting_key);
      if (el) el.value = s.setting_value || '';
    });
  } catch(err) { console.error('Settings load error:', err); }
}
document.getElementById('settings-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving...';
  try {
    const data = {};
    document.querySelectorAll('#settings-form .form-control').forEach(el => { if(el.id) data[el.id] = el.value; });
    await api.put('/admin/settings', data);
    Swal.fire({icon:'success', title:'Saved!', text:'Settings updated successfully.', confirmButtonColor:'#D4AF37'});
  } catch(err) { Swal.fire({icon:'error', title:'Failed', text:err.message}); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save me-2"></i>Save Settings'; }
});
document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
loadSettings();
</script>
</body>
</html>
