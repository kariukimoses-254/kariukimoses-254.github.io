</head>
<body>

  </div>
  <div class="sidebar-user">

  </div>
  <nav class="sidebar-nav">

  <div class="sidebar-footer">

  </div>
</aside>
<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn d-md-none" id="sidebar-toggle" style="font-size:1.2rem;color:#0B1F3A;"><i class="fas fa-bars"></i></button>
      <h4>Contact Messages</h4>
    </div>
    <div class="topbar-right d-flex align-items-center gap-3">
      <span class="fw-semibold" style="font-size:0.9rem;color:#333;">Admin</span>
      <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>
  <div class="dash-content">
    <div class="content-card">
      <div class="card-header"><h5><i class="fas fa-envelope me-2"></i>Contact Form Submissions</h5></div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table">
            <thead><tr><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="messages-tbody"><tr><td colspan="7" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/main.js"></script>
<script>
function formatDate(d){if(!d)return '-';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
async function loadMessages(){
  try{
    const res=await api.get('/contact');
    const messages=res.data.messages||[];
    const tbody=document.getElementById('messages-tbody');
    if(messages.length===0){tbody.innerHTML='<tr><td colspan="7" class="text-center py-5 text-muted">No messages</td></tr>';return}
    tbody.innerHTML=messages.map(function(m){var status=m.is_read?'read':'unread';return '<tr><td><strong>'+(m.is_read?'':'<i class="fas fa-circle text-danger me-1" style="font-size:8px"></i> ')+m.name+'</strong></td><td>'+m.email+'</td><td>'+(m.subject||'N/A')+'</td><td>'+(m.message||'').substring(0,80)+((m.message||'').length>80?'...':'')+'</td><td><span class="badge-status '+status+'">'+(m.is_replied?'Replied':m.is_read?'Read':'Unread')+'</span></td><td>'+formatDate(m.created_at)+'</td><td>'+(!m.is_read?'<button class="btn btn-sm btn-outline-custom" onclick="markRead('+m.contact_id+')"><i class="fas fa-check"></i></button>':'<button class="btn btn-sm btn-outline-custom" onclick="showReplyDialog('+m.contact_id+')"><i class="fas fa-reply"></i></button>')+'</td></tr>'}).join('');
  }catch(err){document.getElementById('messages-tbody').innerHTML='<tr><td colspan="7" class="text-center py-5 text-muted">Failed to load</td></tr>'}
}
async function markRead(id){try{await api.put('/contact/'+id+'/read');loadMessages()}catch(err){Swal.fire({icon:'error',title:'Failed',text:err.message})}}
async function showReplyDialog(id){
  const result=await Swal.fire({title:'Reply to Message',input:'textarea',inputLabel:'Your Reply',inputPlaceholder:'Type your reply...',showCancelButton:true,inputValidator:function(v){if(!v)return 'Reply is required'},confirmButtonColor:'#D4AF37'});
  if(result.value){try{await api.put('/contact/'+id+'/reply',{admin_reply:result.value});Swal.fire({icon:'success',title:'Sent!',text:'Reply sent successfully.',confirmButtonColor:'#D4AF37'});loadMessages()}catch(err){Swal.fire({icon:'error',title:'Failed',text:err.message})}}
}
document.getElementById('logout-btn').addEventListener('click',function(){auth.logout()});
loadMessages();
</script>
</body>
</html>
