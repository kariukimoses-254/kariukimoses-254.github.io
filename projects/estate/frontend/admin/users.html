<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Lil Mosey Estate 6G Edition Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">

</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-icon">LM</div>
    <div class="sidebar-logo-text">
      <h3><span class="gold">Lil Mosey</span> Estate</h3>
      <small>Admin Panel</small>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-user-avatar">A</div>
    <div class="sidebar-user-info">
      <h6 id="user-name">Admin</h6>
      <small>Administrator</small>
    </div>
  </div>
  <nav class="sidebar-nav">
    <span class="sidebar-nav-label">Main</span>
    <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a class="nav-link active" href="users.html"><i class="fas fa-users"></i> Users <span class="nav-badge" id="badge-users"></span></a>
    <a class="nav-link" href="properties.html"><i class="fas fa-building"></i> Properties</a>
    <a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings <span class="nav-badge" id="badge-bookings"></span></a>
    <span class="sidebar-nav-label">Finance</span>
    <a class="nav-link" href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    <a class="nav-link" href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
    <span class="sidebar-separator"></span>
    <span class="sidebar-nav-label">Support</span>
    <a class="nav-link" href="messages.html"><i class="fas fa-envelope"></i> Messages <span class="nav-badge" id="badge-messages"></span></a>
    <a class="nav-link" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance <span class="nav-badge" id="badge-maintenance"></span></a>
    <a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
    <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
</aside>
  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn d-md-none" id="sidebar-toggle" style="font-size:1.2rem;color:#0B1F3A;"><i class="fas fa-bars"></i></button>
        <h4>User Management</h4>
      </div>
      <div class="topbar-right d-flex align-items-center gap-3">
        <span class="fw-semibold" style="font-size:0.9rem;color:#333;">Admin</span>
        <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </header>
    <div class="dash-content">
      <div class="content-card">
        <div class="card-header">
          <h5><i class="fas fa-users me-2"></i>All Users</h5>
          <div class="filter-bar">
            <select class="form-select form-select-sm" id="role-filter">
              <option value="">All Roles</option>
              <option value="admin">Admin</option>
              <option value="agent">Agent</option>
              <option value="customer">Customer</option>
            </select>
            <input type="text" class="form-control form-control-sm" id="search-user" placeholder="Search name or email..." style="width:200px;">
            <button class="btn btn-primary-custom btn-sm" onclick="loadUsers()"><i class="fas fa-search me-1"></i>Search</button>
          </div>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table">
              <thead><tr><th>User</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
              <tbody id="users-tbody"><tr><td colspan="7" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/main.js"></script>
  <script>
  async function loadUsers() {
    try {
      const role = document.getElementById('role-filter').value;
      const search = document.getElementById('search-user').value;
      let endpoint = '/admin/users?';
      if(role) endpoint += 'role=' + role + '&';
      if(search) endpoint += 'search=' + encodeURIComponent(search);

      const res = await api.get(endpoint);
      const users = res.data.users || [];
      const tbody = document.getElementById('users-tbody');
      if(users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No users found</td></tr>';
        return;
      }
      const colors = ['#e74c3c','#D4AF37','#27ae60','#3498db','#9b59b6'];
      tbody.innerHTML = users.map((u, i) => `
        <tr>
          <td>
            <div class="d-flex align-items-center gap-2">
              <div class="user-avatar-sm" style="background:${colors[i%colors.length]}">${(u.first_name||'U').charAt(0)}</div>
              <div><strong>${u.first_name} ${u.last_name}</strong></div>
            </div>
          </td>
          <td>${u.email}</td>
          <td>${u.phone || '-'}</td>
          <td><span class="badge-role ${u.role}">${u.role.charAt(0).toUpperCase() + u.role.slice(1)}</span></td>
          <td><span class="badge-status ${u.is_active ? 'active' : 'inactive'}">${u.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
          <td>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-custom" onclick="toggleStatus(${u.user_id})" title="${u.is_active ? 'Deactivate' : 'Activate'}">
                <i class="fas ${u.is_active ? 'fa-ban' : 'fa-check'}"></i>
              </button>
              <button class="btn btn-outline-danger" onclick="deleteUser(${u.user_id})" title="Delete"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch(err) {
      document.getElementById('users-tbody').innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">Failed to load users</td></tr>';
    }
  }

  async function toggleStatus(userId) {
    try {
      await api.put('/admin/users/' + userId + '/toggle-status');
      Swal.fire({icon:'success', title:'Status Updated', text:'User status toggled successfully.', confirmButtonColor:'#D4AF37'});
      loadUsers();
    } catch(err) { Swal.fire({icon:'error', title:'Failed', text:err.message}); }
  }

  async function deleteUser(userId) {
    const result = await Swal.fire({icon:'warning', title:'Delete User?', text:'This action cannot be undone.', showCancelButton:true, confirmButtonColor:'#e74c3c', confirmButtonText:'Delete'});
    if(result.isConfirmed) {
      try {
        await api.delete('/admin/users/' + userId);
        Swal.fire({icon:'success', title:'Deleted', text:'User deleted successfully.', confirmButtonColor:'#D4AF37'});
        loadUsers();
      } catch(err) { Swal.fire({icon:'error', title:'Failed', text:err.message}); }
    }
  }

    document.getElementById('logout-btn').addEventListener('click', () => auth.logout());
  document.getElementById('search-user').addEventListener('keyup', (e) => { if(e.key === 'Enter') loadUsers(); });
  document.getElementById('role-filter').addEventListener('change', loadUsers);
  loadUsers();
  </script>
</body>
</html>
