  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>
<body>

  <div class="sidebar-logo">

    <div class="sidebar-logo-text">
      <h3><span class="gold">Lil Mosey</span> Estate</h3>
      <small>Admin Panel</small>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="sidebar-user-avatar">A</div>
    <div class="sidebar-user-info">

      <small>Administrator</small>
    </div>
  </div>
  <nav class="sidebar-nav">
    <span class="sidebar-nav-label">Main</span>
    <a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a class="nav-link" href="users.html"><i class="fas fa-users"></i> Users <span class="nav-badge" id="badge-users"></span></a>
    <a class="nav-link" href="properties.html"><i class="fas fa-building"></i> Properties</a>
    <a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings <span class="nav-badge" id="badge-bookings"></span></a>
    <span class="sidebar-nav-label">Finance</span>
    <a class="nav-link" href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
    <a class="nav-link" href="reviews.html"><i class="fas fa-star"></i> Reviews</a>
    <span class="sidebar-separator"></span>
    <span class="sidebar-nav-label">Support</span>
    <a class="nav-link" href="messages.html"><i class="fas fa-envelope"></i> Messages <span class="nav-badge" id="badge-messages"></span></a>
    <a class="nav-link active" href="maintenance.html"><i class="fas fa-tools"></i> Maintenance <span class="nav-badge" id="badge-maintenance"></span></a>
    <a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a>
  </nav>
  <div class="sidebar-footer">
    <a class="nav-link" href="../index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
    <a class="nav-link" href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>
</aside>
<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn d-md-none" id="sidebar-toggle" style="font-size:1.2rem;color:#0B1F3A;"><i class="fas fa-bars"></i></button>
      <h4>Maintenance Requests</h4>
    </div>
    <div class="topbar-right d-flex align-items-center gap-3">
      <span class="fw-semibold" style="font-size:0.9rem;color:#333;">Admin</span>
      <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>
  <div class="dash-content">
    <div class="content-card">
      <div class="card-header"><h5><i class="fas fa-tools me-2"></i>All Maintenance Requests</h5></div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table">
            <thead><tr><th>Title</th><th>Customer</th><th>Property</th><th>Priority</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
            <tbody id="maintenance-tbody"><tr><td colspan="7" class="text-center py-5 text-muted">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/main.js"></script>
<script>
function formatDate(d){if(!d)return '-';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
async function loadRequests(){
  try{
    const res=await api.get('/maintenance');
    const requests=res.data.requests||[];
    const tbody=document.getElementById('maintenance-tbody');
    if(requests.length===0){tbody.innerHTML='<tr><td colspan="7" class="text-center py-5 text-muted">No maintenance requests</td></tr>';return}
    tbody.innerHTML=requests.map(function(r){return '<tr><td><strong>'+r.title+'</strong></td><td>'+(r.customer_first_name||'')+' '+(r.customer_last_name||'')+'</td><td>'+(r.property_title||'-')+'</td><td><span class="badge-status priority-'+r.priority+'">'+(r.priority||'medium').charAt(0).toUpperCase()+(r.priority||'medium').slice(1)+'</span></td><td><span class="badge-status '+r.status+'">'+r.status.replace(/_/g,' ').replace(/\b\w/g,function(l){return l.toUpperCase()})+'</span></td><td>'+formatDate(r.created_at)+'</td><td><button class="btn btn-sm btn-outline-custom" onclick="showStatusDialog('+r.request_id+',\''+r.status+'\')"><i class="fas fa-edit"></i></button></td></tr>'}).join('');
  }catch(err){document.getElementById('maintenance-tbody').innerHTML='<tr><td colspan="7" class="text-center py-5 text-muted">Failed to load</td></tr>'}
}
async function showStatusDialog(id,current){
  const result=await Swal.fire({title:'Update Status',input:'select',inputOptions:{pending:'Pending',in_progress:'In Progress',completed:'Completed',cancelled:'Cancelled'},inputValue:current,showCancelButton:true,confirmButtonColor:'#D4AF37'});
  if(result.value){try{await api.put('/maintenance/'+id+'/status',{status:result.value});Swal.fire({icon:'success',title:'Updated!',text:'Status updated.',confirmButtonColor:'#D4AF37'});loadRequests()}catch(err){Swal.fire({icon:'error',title:'Failed',text:err.message})}}
}
document.getElementById('logout-btn').addEventListener('click',function(){auth.logout()});
loadRequests();
</script>
</body>
</html>
