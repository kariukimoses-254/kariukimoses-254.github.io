<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Lil Mosey Estate 6G Edition</title>
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Playfair+Display:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-left d-none d-md-flex">
    <div class="text-center">
      <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg" style="width:200px;margin-bottom:30px;">
        <defs><linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#D4AF37"/><stop offset="100%" style="stop-color:#b8962e"/></linearGradient></defs>
        <rect x="30" y="70" width="140" height="100" rx="6" fill="rgba(255,255,255,0.1)"/>
        <polygon points="20,75 100,15 180,75" fill="url(#g1)"/>
        <rect x="80" y="110" width="40" height="60" rx="3" fill="#D4AF37" opacity="0.7"/>
        <circle cx="115" cy="140" r="3" fill="#0B1F3A"/>
      </svg>
      <h2 class="text-3d">Join Lil Mosey Estate 6G Edition</h2>
      <p style="color:rgba(255,255,255,0.8);max-width:350px;margin:0 auto;">Create your account and start exploring premium properties across Kenya.</p>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-form glass-modern">
      <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4">
        <span class="brand-icon" style="width:36px;height:36px;background:var(--gradient-primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#D4AF37;font-size:1rem;"><i class="fas fa-home"></i></span>
        <span style="font-family:var(--font-heading);font-size:1.3rem;font-weight:700;color:var(--text);">Lil Mosey <span style="color:var(--secondary);">Estate</span></span>
      </a>
      <h3 style="font-family:var(--font-heading);color:var(--text);margin-bottom:5px;">Create Account</h3>
      <p class="text-muted mb-4">Fill in your details to get started</p>
      <form id="register-form">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control form-control-modern" id="first_name" placeholder="First name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control form-control-modern" id="last_name" placeholder="Last name" required>
          </div>
        </div>
        <div class="mb-3 mt-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control form-control-modern" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control form-control-modern" id="phone" placeholder="+254 7XX XXX XXX">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control form-control-modern" id="password" placeholder="Min. 8 characters" required minlength="8">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control form-control-modern" id="confirm_password" placeholder="Confirm password" required>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label" for="terms">I agree to the <a href="#" style="color:#D4AF37;">Terms of Service</a> and <a href="#" style="color:#D4AF37;">Privacy Policy</a></label>
        </div>
        <button type="submit" class="btn btn-primary-custom btn-3d btn-3d-gold w-100 mb-3" id="register-btn">
          <span id="register-text">Create Account</span>
          <span id="register-spinner" class="d-none"><i class="fas fa-spinner fa-spin"></i> Creating...</span>
        </button>
        <p class="text-center text-muted">Already have an account? <a href="login.html" style="color:#D4AF37;font-weight:600;">Sign In</a></p>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm_password').value;

  if (password !== confirmPassword) {
    Swal.fire({ icon: 'error', title: 'Password Mismatch', text: 'Passwords do not match.' });
    return;
  }

  const btn = document.getElementById('register-btn');
  btn.disabled = true;
  document.getElementById('register-text').classList.add('d-none');
  document.getElementById('register-spinner').classList.remove('d-none');

  try {
    const data = await api.post('/auth/register', {
      first_name: document.getElementById('first_name').value,
      last_name: document.getElementById('last_name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      password: password
    });

    auth.setAuth(data.data.accessToken, data.data.user);

    Swal.fire({
      icon: 'success',
      title: 'Registration Successful!',
      text: 'Please check your email to verify your account.',
      confirmButtonColor: '#D4AF37'
    }).then(() => {
      if (data.data.user.role === 'admin') window.location.href = 'admin/dashboard.html';
      else if (data.data.user.role === 'agent') window.location.href = 'dashboard.html?tab=agent';
      else window.location.href = 'customer/dashboard.html';
    });
  } catch (error) {
    Swal.fire({ icon: 'error', title: 'Registration Failed', text: error.message });
  } finally {
    btn.disabled = false;
    document.getElementById('register-text').classList.remove('d-none');
    document.getElementById('register-spinner').classList.add('d-none');
  }
});
</script>
</body>
</html>
