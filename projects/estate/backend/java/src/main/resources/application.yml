spring:
  application:
    name: fullstack-java-api
  datasource:
    url: jdbc:mysql://localhost:3306/fullstack_estate_mysql?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
graphql:
  graphiql:
    enabled: true
  playground:
    enabled: true
  schema-location-pattern: classpath*:graphql/**/*.graphqls