<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrator Login | Lil-Mosey Motorcycle Dealers</title><link rel="stylesheet" href="css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f3f5f8;padding:24px}.login{width:min(430px,100%);background:#fff;padding:34px;border-radius:18px;box-shadow:0 18px 60px #17203318}.login h1{margin:8px 0}.login label{display:block;font-weight:600;margin:18px 0 8px}.login input{width:100%;padding:13px;border:1px solid #d9dee8;border-radius:9px}.login button{width:100%;margin-top:18px}.error{color:#b42318;font-size:14px;min-height:20px}.back{display:inline-block;margin-top:20px}</style></head><body><main class="login"><p class="eyebrow">LIL-MOSEY MOTORCYCLE DEALERS</p><h1>Administrator sign in</h1><p class="muted">This area is restricted to authorized dealership administrators.</p><form id="loginForm"><label for="password">Admin password</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button class="primary" type="submit">Sign in securely</button><p class="error" id="error" role="alert"></p></form><a class="back" href="/home.html">← Back to customer website</a></main><script>document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Sign in failed');location.href='/admin/';}catch(err){error.textContent=err.message||'Unable to sign in. Check your server configuration.';}});</script></body></html>
