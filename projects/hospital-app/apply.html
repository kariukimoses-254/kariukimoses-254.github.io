  <main>
    <h2>Doctor Application</h2>
    <p>Apply to join Lil Mosey Hospital's medical team.</p>
    <form id="applyForm" class="form-card" style="margin-top:16px">
      <input id="name" placeholder="Full Name" required />
      <input id="spec" placeholder="Specialization" required />
      <input id="phone" placeholder="Phone" required />
      <input id="email" type="email" placeholder="Email" required />
      <input id="experience" placeholder="Years of Experience" required />
      <input id="photo" type="file" accept="image/*" title="Upload your photo" />
      <textarea id="message" placeholder="Why do you want to join?" style="flex:1 1 100%;padding:10px;border:1px solid #ccc;border-radius:6px" required></textarea>
      <button type="submit">Submit Application</button>
    </form>
    <p id="msg" style="color:green;margin-top:10px"></p>
  </main>

  <script>
    document.getElementById('applyForm').addEventListener('submit', async e => {
      e.preventDefault();
      const toBase64 = f => new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(f);
      });
      const photoFile = document.getElementById('photo').files[0];
      const body = {
        name: name.value.trim(), spec: spec.value.trim(), phone: phone.value.trim(),
        email: email.value.trim(), experience: experience.value.trim(), message: message.value.trim(),
        photo: photoFile ? await toBase64(photoFile) : undefined,
      };
      await fetch('/api/applications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      document.getElementById('msg').textContent = '✅ Application submitted! We will contact you soon.';
      e.target.reset();
    });
  </script>
