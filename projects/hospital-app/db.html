<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lil Mosey Hospital database overview: record counts and the most recent entries." />
  <title>Lil Mosey Hospital - Database</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="client.css" />
<script src="nav.js" defer></script>
</head>
<body>
    <header class="topbar">
    <a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true">+</span><span class="brand-text">Lil Mosey <span>Hospital</span></span></a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation">
      <a class="nav-btn" href="home.html">Home</a>
      <a class="nav-btn active" href="db.html" aria-current="page">Database</a>
      <a class="nav-btn nav-btn--quiet" href="index.html">Staff Dashboard</a>
    </nav>
  </header>

  <main>
    <h2>📊 Database Overview</h2>
    <div class="stats-grid" id="dbStats">
      <div class="spinner"></div>
    </div>

    <h2>Recent Records</h2>
    <table>
      <thead><tr><th>Patient</th><th>Department</th><th>Doctor</th><th>Diagnosis</th><th>Status</th></tr></thead>
      <tbody id="recentRecords"></tbody>
    </table>
  </main>

  <footer class="footer">
    <div class="footer-links"><a href="home.html">Home</a> | <a href="about.html">About</a> | <a href="services.html">Services</a> | <a href="doctors.html">Doctors</a> | <a href="appointments.html">Appointments</a> | <a href="contact.html">Contact</a> | <a href="guidance.html">Guidance</a></div>
    <p>© 2026 Lil Mosey Hospital. All rights reserved.</p>
  </footer>

  <script>
    fetch('/api/db-summary')
      .then(r => r.json())
      .then(s => {
        document.getElementById('dbStats').innerHTML = Object.entries(s).map(([table, count]) =>
          `<div class="stat-card"><h3>${count}</h3><p>${table.replace('_', ' ')}</p></div>`).join('');
      });

    fetch('/api/records')
      .then(r => r.json())
      .then(rows => {
        document.getElementById('recentRecords').innerHTML = rows.slice(0, 6).map(r =>
          `<tr><td>${r.patient_name}</td><td>${r.department}</td><td>${r.doctor}</td><td>${r.diagnosis}</td><td>${r.status}</td></tr>`
        ).join('') || '<tr><td colspan="5">No records yet.</td></tr>';
      });
  </script>
  <script src="theme.js"></script>
  <script src="auth.js"></script>
</body>
</html>
