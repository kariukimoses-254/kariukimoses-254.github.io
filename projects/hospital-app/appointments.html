  <script>
    const apptBody = document.getElementById('apptBody');
    const user = JSON.parse(localStorage.getItem('hms_user') || 'null');
    let allDoctors = [];

    function spawnConfetti() {
      const colors = ['#1e5eff', '#00b4d8', '#ffd43b', '#ff4d6d', '#69db7c'];
      for (let i = 0; i < 30; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[i % colors.length];
        piece.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 1800);
      }
    }

    async function loadAppointments() {
      try {
        const url = user ? `/api/appointments/mine/${encodeURIComponent(user.email)}` : '/api/appointments';
        const res = await fetch(url, { headers: { Accept: 'application/json' } });
        const type = (res.headers.get('content-type') || '').toLowerCase();
        if (!res.ok || type.indexOf('json') === -1) throw new Error('API unavailable');
        const appts = await res.json();
        apptBody.innerHTML = appts.map(a =>
          `<tr><td>${a.patient}</td><td>${a.doctor}</td><td>${new Date(a.date).toLocaleDateString()}</td><td>${a.time}</td></tr>`
        ).join('') || '<tr><td colspan="4">No appointments yet.</td></tr>';
      } catch (err) {
        apptBody.innerHTML = '<tr><td colspan="4">Appointments are stored by the hospital server, so the list is empty in this static demo.</td></tr>';
      }
    }

    function renderBookingForm() {
      const area = document.getElementById('bookingArea');
      if (!user) {
        area.innerHTML = `
          <div class="form-card" style="text-align:center;padding:30px">
            <p style="margin:0;flex:1 1 100%">🔒 Please <a href="login.html">sign in</a> or <a href="register.html">register</a> first to book an appointment.</p>
          </div>`;
        return;
      }
      area.innerHTML = `
        <form id="apptForm" class="form-card">
          <input id="patient" placeholder="Patient Name" value="${user.name}" readonly />
          <select id="specFilter"><option value="">All Qualifications</option></select>
          <select id="doctor" required></select>
          <input id="date" type="date" required />
          <input id="time" type="time" required />
          <button type="submit">Book Appointment</button>
        </form>
        <p id="msg" style="color:green;margin-top:10px"></p>`;

      const specFilter = document.getElementById('specFilter');
      const doctorSel = document.getElementById('doctor');
      [...new Set(allDoctors.map(d => d.spec))].sort().forEach(s =>
        specFilter.innerHTML += `<option value="${s}">${s}</option>`);

      // A doctor picked on the Doctors page arrives as ?doctor=Name
      const requested = new URLSearchParams(location.search).get('doctor');
      const wanted = allDoctors.find(d => d.name === requested);
      if (wanted) specFilter.value = wanted.spec;

      function fillDoctors() {
        const list = allDoctors.filter(d => !specFilter.value || d.spec === specFilter.value);
        doctorSel.innerHTML = list.map(d => `<option value="${d.name}">${d.name} (${d.spec})</option>`).join('') || '<option>No doctors</option>';
        if (wanted && list.some(d => d.name === wanted.name)) doctorSel.value = wanted.name;
      }
      specFilter.addEventListener('change', fillDoctors);
      fillDoctors();

      document.getElementById('apptForm').addEventListener('submit', async e => {
        e.preventDefault();
        const body = { patient: patient.value.trim(), doctor: doctor.value, date: date.value, time: time.value, email: user.email };
        await fetch('/api/appointments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        spawnConfetti();
        document.getElementById('msg').textContent = '✅ Appointment booked!';
        e.target.reset();
        patient.value = user.name;
        loadAppointments();
      });
    }

    window.HospitalDoctors.load().then(d => { allDoctors = d; renderBookingForm(); });
    loadAppointments();
  </script>
