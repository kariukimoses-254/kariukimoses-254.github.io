<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lil Mosey Hospital - My Messages</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="client.css" />
<script src="nav.js" defer></script>
</head>
<body>
    <header class="topbar">
    <a class="brand" href="home.html"><span class="brand-mark" aria-hidden="true">+</span><span class="brand-text">Lil Mosey <span>Hospital</span></span></a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation">
      <a class="nav-btn" href="home.html">Home</a>
      <a class="nav-btn active" href="messages.html" aria-current="page">My Messages</a>
      <a class="nav-btn nav-btn--quiet" href="index.html">Staff Dashboard</a>
    </nav>
  </header>

  <main>
    <h2>💬 My Messages</h2>
    <p id="note"></p>
    <table>
      <thead><tr><th>Subject</th><th>Message</th><th>Date</th></tr></thead>
      <tbody id="myMessages"></tbody>
    </table>
  </main>

  <footer class="footer"><div class="footer-links"><a href="home.html">Home</a> | <a href="about.html">About</a> | <a href="services.html">Services</a> | <a href="doctors.html">Doctors</a> | <a href="appointments.html">Appointments</a> | <a href="contact.html">Contact</a> | <a href="guidance.html">Guidance</a></div><p>© 2026 Lil Mosey Hospital. All rights reserved.</p></footer>

  <script>
    const user = JSON.parse(localStorage.getItem('hms_user') || 'null');
    const note = document.getElementById('note');
    const tbody = document.getElementById('myMessages');
    if (!user) {
      note.textContent = '🔒 Please sign in to view your messages.';
      note.style.color = 'red';
      document.querySelector('table').style.display = 'none';
    } else {
      note.textContent = `Showing only messages from ${user.email}`;
      fetch(`/api/messages/mine/${encodeURIComponent(user.email)}`)
        .then(r => r.json())
        .then(rows => {
          tbody.innerHTML = rows.map(m =>
            `<tr><td>${m.subject}</td><td>${m.message}</td><td>${new Date(m.created_at).toLocaleString()}</td></tr>`
          ).join('') || '<tr><td colspan="3">No messages yet.</td></tr>';
        });
    }
  </script>
  <script src="theme.js"></script>
  <script src="auth.js"></script>
</body>
</html>
